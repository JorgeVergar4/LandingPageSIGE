<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | SIGE</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/index.js" defer></script>
</head>
<body>
    <header>
        <div class="header-top">
            <h1>🏎️ Fórmula 1 - SIGE</h1>
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="blog.html">Blog</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>
    <main class="contact-container">
        <section>
            <h2>Contacta con SIGE</h2>
            <p>¿Tienes consultas, sugerencias o deseas sumarte a nuestra comunidad? Déjanos un mensaje a continuación.</p>
        </section>

        <form id="contact-form" action="https://formspree.io/f/tu-id-aqui" method="POST">
            <h3>Envíanos un Mensaje</h3>
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="¿En qué podemos ayudarte?" required></textarea>
            </div>

            <button type="submit" id="btn-enviar">Enviar Mensaje</button>
        </form>
        <div id="form-status"></div>
    </main>

    <footer>
        <p>2026 sige - a los pits</p>
    </footer>
</body>
</html>
